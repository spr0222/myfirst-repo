#create a cloudformation template for vpc stack
AWSTemplateFormatVersion: '2010-09-09'
Description: CloudFormation template to create a VPC stack with subnets, route tables, and internet gateway.
Resources:
  MyVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true  

      